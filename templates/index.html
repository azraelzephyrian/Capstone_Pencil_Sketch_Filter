<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencil Sketch App</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1><span>Pencil Sketch App</span></h1>

      <!-- Upload Form -->
      <form
        action="/upload"
        method="post"
        enctype="multipart/form-data"
        onsubmit="playClickSound()"
      >
        <div class="upload-wrapper">
          <input type="file" name="file" accept="image/*" required />
          <button class="btn" type="submit">Upload</button>
        </div>
      </form>

      <!-- Basic Buttons -->
      <div class="basic-buttons">
        <form
          action="/convert/pencil"
          method="post"
          onsubmit="playClickSound()"
        >
          <button class="btn" type="submit">Generate Pencil Sketch</button>
        </form>
      </div>

      <div class="basic-buttons">
        <button class="voice-command-btn" id="voice-command-btn">
          <span class="icon">🎤</span> Start Voice Command
        </button>
        <button class="btn" id="tutorial-btn">
          ❓ Voice Tutorial
        </button>        
      </div>
      
      <!-- Active Image Display with Rotate Buttons -->
      <div class="active-image-container">
        <img
          id="active-image"
          class="active-image"
          src="/active-image"
          alt="Current Active Image"
          onerror="this.style.display='none';"
        />
        <div class="rotate-buttons">
          <button type="button" onclick="rotateImage(-90)">↺</button>
          <button type="button" onclick="rotateImage(90)">↻</button>
          <a href="/download" download>
            <span class="download-icon" style="font-size: 24px">⬇</span>
          </a>
        </div>
      </div>

      <!-- Rotate Forms -->
      <form
        id="rotate-left-form"
        action="/rotate/left"
        method="post"
        style="display: none"
      ></form>
      <form
        id="rotate-right-form"
        action="/rotate/right"
        method="post"
        style="display: none"
      ></form>

      <!-- Filter Grid and Active Filter Section -->
      <div class="filter-container">
        <!-- Active Filter Section (Displayed Above the Grid) -->
        <div id="active-filter" class="active-filter" style="display: none;">
          <h2 class="btn" id="active-header">Active Filter</h2>
          <div id="active-form"></div>
        </div>

        <!-- Filter Grid -->
        <div class="filter-grid">
          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">COLORIZE WITH IMAGE</h2>
            <form class="filter-form" action="/colorize_with_image" method="post" enctype="multipart/form-data">
              <label>Upload Color Source Image:
                <input type="file" name="color_source" accept="image/*" required />
              </label>
              <button class="btn" type="submit">Apply Colorization</button>
            </form>
          </div>

          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">RESIZE IMAGE</h2>
            <form class="filter-form" action="/resize" method="post">
              <label>Scale Percent:
                <input type="number" name="scale_percent" value="100" min="1" max="500" />
              </label>
              <button class="btn" type="submit">Apply Resize</button>
            </form>
          </div>

          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">MOSAIC PARAMETERS</h2>
            <form class="filter-form" action="/mosaic" method="post">
              <label>Num Cells:
                <input type="number" name="num_cells" value="2000" />
              </label>
              <label>Edge Thickness:
                <input type="number" name="edge_thickness" value="1" />
              </label>
              <button class="btn" type="submit">Apply Mosaic</button>
            </form>
          </div>

          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">STROKE PARAMETERS</h2>
            <form class="filter-form" action="/stroke" method="post">
              <label>Stroke Length:
                <input type="number" name="stroke_length" value="5" />
              </label>
              <label>Stroke Thickness:
                <input type="number" name="stroke_thickness" value="1" />
              </label>
              <label>Inverse Density:
                <input type="number" name="inv_density" value="0.7" />
              </label>
              <button class="btn" type="submit">Apply Stroke</button>
            </form>
          </div>

          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">CEL SHADING PARAMETERS</h2>
            <form class="filter-form" action="/cel-shade" method="post">
              <label>Bilateral d:
                <input type="number" name="bilateral_d" value="9" min="1" max="25" />
              </label>
              <label>Bilateral Sigma Color:
                <input type="number" name="bilateral_sigmaColor" value="75" min="1" max="250" />
              </label>
              <label>Bilateral Sigma Space:
                <input type="number" name="bilateral_sigmaSpace" value="75" min="1" max="250" />
              </label>
              <label>Median Blur ksize:
                <input type="number" name="median_blur_ksize" value="7" step="2" min="3" max="31" />
              </label>
              <label>Canny Thresh1:
                <input type="number" name="canny_thresh1" value="50" min="0" max="255" />
              </label>
              <label>Canny Thresh2:
                <input type="number" name="canny_thresh2" value="150" min="0" max="255" />
              </label>
              <label>Num Colors:
                <input type="number" name="num_colors" value="12" min="4" max="24" />
              </label>
              <label>Edge Thickness:
                <input type="number" name="edge_thickness" value="2" />
              </label>
              <button class="btn" type="submit">Apply Cel Shading</button>
            </form>
          </div>

          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">POSTER PARAMETERS</h2>
            <form class="filter-form" action="/poster" method="post">
              <label>Posterize Levels:
                <input type="number" name="posterize_levels" value="16" />
              </label>
              <label>Color Intensity:
                <input type="number" name="color_intensity" value="0.9" />
              </label>
              <label>Gamma:
                <input type="number" name="gamma" value="1.3" />
              </label>
              <button class="btn" type="submit">Apply Poster</button>
            </form>
          </div>
          
          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">GAUSSIAN SKETCH PARAMETERS</h2>
            <form class="filter-form" action="/gaussian-sketch" method="post">
              <label>Blur ksize:
                <input type="number" name="blur_ksize" value="5" min="1" max="31" step="2" />
              </label>
              <label>Canny Thresh1:
                <input type="number" name="canny_thresh1" value="50" min="0" max="255" />
              </label>
              <label>Canny Thresh2:
                <input type="number" name="canny_thresh2" value="150" min="0" max="255" />
              </label>
              <label>Dilate Iter:
                <input type="number" name="dilate_iter" value="1" min="0" max="10" />
              </label>
              <label>Alpha Blend:
                <input type="number" name="alpha_blend" value="0.6" step="0.1" min="0" max="1" />
              </label>
              <label>Num Gaussians:
                <input type="number" name="num_gaussians" value="5000" min="1" />
              </label>
              <label>Sigma:
                <input type="number" name="sigma" value="2.0" step="0.1" min="0" />
              </label>
              <label>Edge Alpha:
                <input type="number" name="edge_alpha" value="0.85" step="0.05" min="0" max="1" />
              </label>
              <button class="btn" type="submit">Apply Gaussian Sketch</button>
            </form>
          </div>
          
          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">GAN PENCIL SKETCH</h2>
            <form class="filter-form" action="/generate_pencil_sketch_GAN/" method="post">
              <button class="btn" type="submit">Generate Pencil Sketch</button>
            </form>
          </div>

          <div class="filter-section">
            <h2 onclick="toggleFilter(this)" class="btn">GAN EDGE SKETCH</h2>
            <form class="filter-form" action="/generate_edge_sketch_GAN/" method="post">
              <button class="btn" type="submit">Generate Edge Sketch</button>
            </form>
          </div>
        </div>
      </div>

    <audio id="click-sound" src="/static/click.mp3" preload="auto"></audio>

    <script>
      window.onload = function () {
        if (performance.navigation.type === 1) {
          // Check if it's a manual refresh
          document.getElementById("active-image").src = "";
        }
      };

      let rotation = 0;

      function rotateImage(degrees) {
        rotation += degrees;

        const image = document.getElementById("active-image");
        image.style.transform = `rotate(${rotation}deg)`;

        // Adjust the scale when rotating to avoid overflow
        if (rotation % 180 !== 0) {
          // When rotated 90 or 270 degrees
          image.style.transform += " scale(0.8)";
        } else {
          image.style.transform += " scale(1)";
        }
      }
      function playClickSound() {
        const audio = document.getElementById("click-sound");
        if (audio) {
          audio.currentTime = 0;
          audio.play();
        }
      }

      function toggleFilter(header) {
        playClickSound();
        const filterSection = header.closest('.filter-section');
        const form = filterSection.querySelector('.filter-form');

        // Move the active filter to the top
        const activeFilter = document.getElementById('active-filter');
        const activeHeader = document.getElementById('active-header');
        const activeForm = document.getElementById('active-form');

        // Update active header and form content
        activeHeader.textContent = header.textContent;
        activeForm.innerHTML = form.outerHTML;

        // Display the active section above the grid
        activeFilter.style.display = 'flex';

        // Make sure the form inside the active area is visible
        const activeFormInside = activeForm.querySelector('.filter-form');
        if (activeFormInside) {
          activeFormInside.classList.add('active');
        }

        // Remove active class from any previously highlighted button
        document.querySelectorAll('.filter-section h2').forEach(el => el.classList.remove('active'));

        // Add active class to the clicked button
        header.classList.add('active');
      }

      if ("webkitSpeechRecognition" in window) {
        const recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "en-US";

        const micButton = document.getElementById("voice-command-btn");

        recognition.onstart = () => {
          console.log("🎤 Listening...");
          micButton.classList.add("listening");
        };

        recognition.onend = () => {
          micButton.classList.remove("listening");
        };

        async function interpretTranscript(transcript) {
          console.log("📤 Sending transcript to backend:", transcript);
          const response = await fetch("/interpret_voice_command", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ transcript }),
          });

          const data = await response.json();
          return data;
        }

        async function promptUserForParam(paramName) {
          return new Promise((resolve) => {
            recognition.onresult = async (event) => {
              const followup = event.results[0][0].transcript.toLowerCase();
              console.log(`🎧 Received value for ${paramName}:`, followup);

              const parsedValue = followup.match(/\d+/);
              if (parsedValue) {
                resolve(parsedValue[0]); // Return just the number
              } else {
                alert(`Could not understand a numeric value for ${paramName}. Try again.`);
                resolve(await promptUserForParam(paramName)); // Retry recursively
              }
            };
            recognition.start();
          });
        }

        async function processVoiceCommand(transcript) {
          const intent = await interpretTranscript(transcript);
          console.log("🧠 LLM response:", intent);

          const action = intent.action;
          const known = intent.params?.known || {};
          const missing = intent.params?.missing || [];

          const allParams = { ...known };

          // If there are missing parameters, ask the user for them one-by-one
          for (const param of missing) {
            const userValue = await promptUserForParam(param);
            allParams[param] = userValue;
          }

          // Dispatch action once all values are gathered
          if (action === "HELP") {
            speakTutorial();
            return;
          }

          if (action === "EXPLAIN" && intent.question) {
            const response = await fetch("/explain_query", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ question: intent.question }),
            });

            const data = await response.json();
            if (data.lines) {
              speakTutorial(data.lines);
            } else {
              alert("Sorry, I couldn't explain that.");
            }
            return;
          }


          switch (action) {
            case "ROTATE LEFT":
              document.querySelector("form[action='/rotate/left']").submit();
              break;
            case "ROTATE RIGHT":
              document.querySelector("form[action='/rotate/right']").submit();
              break;
            case "DOWNLOAD":
              document.querySelector("a[href='/download']").click();
              break;
            case "APPLY RESIZE":
              fillFormAndSubmit("/resize", allParams);
              break;
            case "APPLY CEL SHADE":
              fillFormAndSubmit("/cel-shade", allParams);
              break;
            case "APPLY POSTER":
              fillFormAndSubmit("/poster", allParams);
              break;
            case "APPLY GAUSSIAN":
              fillFormAndSubmit("/gaussian-sketch", allParams);
              break;
            case "APPLY MOSAIC":
              fillFormAndSubmit("/mosaic", allParams);
              break;
            case "APPLY STROKE":
              fillFormAndSubmit("/stroke", allParams);
              break;
            case "APPLY COLORIZATION":
              alert("Voice colorization only works with a file input. Please upload manually.");
              break;
            case "APPLY PENCIL":
              document.querySelector("form[action='/convert/pencil'] button").click();
              break;
            case "APPLY GAN PENCIL":
              document.querySelector("form[action='/generate_pencil_sketch_GAN/'] button").click();
              break;
            case "APPLY GAN EDGE":
              document.querySelector("form[action='/generate_edge_sketch_GAN/'] button").click();
              break;
            case "UNKNOWN":
            default:
              alert("Sorry, I didn't understand the command.");
          }
        }

        function fillFormAndSubmit(actionPath, params) {
          const form = document.querySelector(`form[action='${actionPath}']`);
          if (!form) {
            alert("Form not found for action: " + actionPath);
            return;
          }

          for (const [key, value] of Object.entries(params)) {
            const input = form.querySelector(`[name='${key}']`);
            if (input) {
              input.value = value;
            }
          }

          // Submit
          form.querySelector("button[type='submit']").click();
        }

        micButton.addEventListener("click", () => {
          recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            playClickSound();
            console.log("🎧 Heard:", transcript);
            await processVoiceCommand(transcript);
          };
          recognition.start();
        });

        recognition.onerror = (event) => {
          console.error("💥 Voice recognition error:", event.error);
          micButton.classList.remove("listening");
        };
      } else {
        document.getElementById("voice-command-btn").style.display = "none";
        alert("Your browser does not support voice recognition.");
      }


      document.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
        });
      });

        const tutorialLines = [
          "Welcome to the Pencils Sketch App!",
          "You can upload an image using the Upload button at the top.",
          "To interact using voice, click the microphone button and say commands like:",
          "Rotate left,",
          "Apply Poster",
          "Apply Gaussian Sketch",
          "or Resize to 80 percent.",
          "For filters like cel shading", 
          "or resizing, you can specify parameters like size or number of colors; to see a list of available parameters, click on the filter you wish to inspect.",
          "Once processed, you can download your final image by saying 'download' or clicking the download arrow.",
          "That's the basics! Say 'help' again if you'd like to hear this tutorial once more, or ask for specific explanations of how to use any of the filters."
        ];

        function speakTutorial(lines = tutorialLines) {
          const synth = window.speechSynthesis;
          let voices = synth.getVoices();  // Get voices later if empty
          const overlay = document.getElementById("voice-help-overlay");
          overlay?.classList.add("show");

          let i = 0;
          function speakNext() {
            if (i >= lines.length) {
              setTimeout(() => overlay?.classList.remove("show"), 5000);
              return;
            }

            const line = lines[i];
            console.log(`🔊 Speaking line ${i + 1}/${lines.length}: "${line}"`);

            if (voices.length === 0) {
              voices = synth.getVoices();  // Refresh voices if not loaded
            }

            const voice = voices.find(v => v.lang.startsWith("en")) || null;
            const utterance = new SpeechSynthesisUtterance(line);
            if (voice) utterance.voice = voice;

            const lineLower = line.toLowerCase();

            for (const keyword in highlightMap) {
              if (lineLower.includes(keyword)) {
                const selectors = Array.isArray(highlightMap[keyword]) ? highlightMap[keyword] : [highlightMap[keyword]];

                selectors.forEach(selector => {
                  // Special handling for pseudo :contains() → h2 titles
                  if (selector.startsWith("h2.btn:contains(")) {
                    const textTarget = selector.match(/'(.+?)'/)[1].toLowerCase();
                    document.querySelectorAll("h2.btn").forEach(h2 => {
                      if (h2.textContent.toLowerCase().includes(textTarget)) {
                        console.log(`✨ Highlighting section header: "${h2.textContent.trim()}"`);
                        h2.classList.remove("glow-highlight");
                        void h2.offsetWidth;
                        h2.classList.add("glow-highlight");
                        setTimeout(() => h2.classList.remove("glow-highlight"), 3000);
                      }
                    });
                  } else {
                    // Normal selector logic
                    const matches = document.querySelectorAll(selector);
                    if (matches.length === 0) {
                      console.warn(`❌ No elements matched for keyword "${keyword}" → selector: "${selector}"`);
                    } else {
                      console.log(`✨ Highlighting "${keyword}" → selector: "${selector}" (${matches.length} match${matches.length > 1 ? 'es' : ''})`);
                      matches.forEach(el => {
                        el.classList.remove("glow-highlight");
                        void el.offsetWidth;
                        el.classList.add("glow-highlight");
                        setTimeout(() => el.classList.remove("glow-highlight"), 3000);
                      });
                    }
                  }
                });
              }
            }

            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.onend = speakNext;
            synth.speak(utterance);
            i++;
          }

          speakNext();
        }




        const highlightMap = {
          "upload": "form[action='/upload'] button",
          "download": "a[href='/download'] .download-icon",
          "rotate": ".rotate-buttons button",
          "voice": "#voice-command-btn",

          // Toggle headers (visible even when form is collapsed)
          "resize": "h2.btn:contains('RESIZE IMAGE')",
          "cel": "h2.btn:contains('CEL SHADING PARAMETERS')",
          "mosaic": "h2.btn:contains('MOSAIC PARAMETERS')",
          "stroke": "h2.btn:contains('STROKE PARAMETERS')",
          "gaussian": "h2.btn:contains('GAUSSIAN SKETCH PARAMETERS')",
          "poster": "h2.btn:contains('POSTER PARAMETERS')",
          "colorization": "h2.btn:contains('COLORIZE WITH IMAGE')",
          "colorize": "h2.btn:contains('COLORIZE WITH IMAGE')",
          "gan": "h2.btn:contains('GAN PENCIL SKETCH')",
          "edge": "h2.btn:contains('GAN EDGE SKETCH')",
          "posterize": "h2.btn:contains('POSTER PARAMETERS')",
          "pencil sketch": "form[action='/convert/pencil'] button",
          "gan": ["h2.btn:contains('GAN PENCIL SKETCH')", "h2.btn:contains('GAN EDGE SKETCH')"],
          "edge": ["h2.btn:contains('GAN EDGE SKETCH')"],
          "apply": ["form[action='/resize'] button", "form[action='/cel-shade'] button", "form[action='/mosaic'] button", "form[action='/stroke'] button", "form[action='/gaussian-sketch'] button", "form[action='/colorize_with_image'] button", "form[action='/poster'] button", "form[action='/generate_pencil_sketch_GAN/'] button", "form[action='/generate_edge_sketch_GAN/'] button"]
        };



        document.getElementById("tutorial-btn").addEventListener("click", () => {
          speakTutorial();
        });


    </script>
  </body>
</html>
